name: Build Electron Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - electron-notary-test
    paths:
      - apps/app/**
      - apps/desktop/**
      - packages/ui/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-desktop.yml

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          # Both Mac architectures build (see release.yml for the rationale).
          - os: macos-15-intel
            artifact: macos-intel
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so setup-node can find the
      # pnpm binary on PATH. Matches the pattern in build-desktop.yml so
      # the two workflows share the same bootstrap story.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Bun >= 1.3.10 is required to compile bun-windows-arm64 sidecars.
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Howland: build the FULL installers (not --dir) and brand at build time via electron-builder
      # -c overrides. On Ubuntu this produces AppImage + tar.gz + deb (deb from the
      # electron-builder.yml linux.target list). --publish never = artifacts only.
      - name: Package Electron desktop (Howland installers)
        shell: bash
        run: |
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml \
            -c.productName=Howland -c.appId=com.howland.app \
            '-c.artifactName=howland-${os}-${arch}-${version}.${ext}' \
            -c.publish.0.owner=ayers-software-repair -c.publish.0.repo=howland-releases \
            --publish never

      - name: Upload Howland installers
        uses: actions/upload-artifact@v4
        with:
          name: howland-electron-${{ matrix.artifact }}
          path: apps/desktop/dist-electron/**
