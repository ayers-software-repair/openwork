name: Public demo checks

on:
  push:
    branches: [howland]
    paths:
      - apps/app/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - constants.json
      - .github/workflows/demo-checks.yml
  pull_request:
    branches: [howland]

permissions:
  contents: read

concurrency:
  group: howland-demo-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-ui:
    if: github.repository == 'ayers-software-repair/openwork'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.1'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openwork/types build
      - name: Check actual application types
        run: pnpm --filter @openwork/app typecheck
      - name: Check isolated conversation and read-only components
        working-directory: apps/app
        run: |
          bun test tests/demo-client.test.ts
          bun test tests/demo-app-mount.test.tsx
          bun test tests/composer-text-only.test.tsx
          bun test tests/org-mcp-disabled.test.tsx
          bun test tests/message-list-read-only.test.tsx
      - name: Build the actual public browser entry
        env:
          HOWLAND_PUBLIC_DEMO: '1'
        run: pnpm --filter @openwork/app build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-demo-ui
          path: apps/app/dist-demo/
          if-no-files-found: error
          retention-days: 14
