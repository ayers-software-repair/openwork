name: Submit Howland for iOS

# THE STORE HEAD, ON ITS OWN CADENCE. Dispatch only — never a tag, never part of the release run.
#
# The .ipa this produces is NOT a release asset and never becomes one: App Store Connect is its
# distribution channel, and an .ipa sitting on a release page installs for nobody. That is exactly
# why it is not in release.yml. Building it there meant a ten-times-billed macOS archive on every
# 1.0.0 rebuild for output the release never carries, and store submission does not have a
# per-rebuild cadence anyway — you submit when there is something to submit, and review takes days
# (owner ruling 2026-08-25).
#
# IT HARD FAILS WITHOUT ITS SIGNING SECRETS, and that is NOT an inconsistency with the release
# workflow's skip-and-report rule — do not "fix" it. That rule exists because a PARTIAL RELEASE is
# an outcome the owner asked for: assets appear as certificates land. A store submission has no
# release to be partial about. Somebody pressed this button meaning "submit this", so a dispatch
# that quietly does nothing is the silence problem wearing a new hat. Uniformity means the same
# RULE, not the same behaviour in different situations (owner ruling 2026-08-25).
#
# It writes no skip records either: it owes the release nothing, so there is no expected asset for
# it to explain.
#
# THE BINARY STAYS A CI ARTIFACT, deliberately, and it EXPIRES — 90 days, the ceiling GitHub
# allows on a public repository, set explicitly below. It is never published to howland-releases:
# that repo is PUBLIC, and a signed store binary on a public download page is exposure with no
# upside, since an .ipa installs for nobody who downloads it. The Actions run page is behind
# authentication, which is the private channel the hand-upload to App Store Connect needs.
#
# The build number is github.run_number, which keeps increasing across dispatches — App Store
# Connect rejects a re-upload at a build number it has already seen, and the display version stays
# locked at 1.0.0.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to stamp (e.g. howland-v1.0.0); the build number comes from the run'
        required: true

permissions:
  contents: read

# Two dispatches must not race the same App Store Connect build number.
concurrency:
  group: howland-ios-submission
  cancel-in-progress: false

jobs:

  build-ios:
    if: github.repository == 'ayers-software-repair/openwork'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The iOS leg owes the release NOTHING: the .ipa is never a release asset (it goes to App
      # Store Connect, and an .ipa on a release page is not installable by a normal person). So
      # it writes no skip records — there is no expected asset for it to explain.
      #
      # It still gates on the certificate, and the reason is cost: macos-latest bills at 10x, and
      # an archive nobody can export is ten-times-billed minutes for nothing.
      # This workflow exists ONLY to produce the .ipa, so a dispatch that cannot sign FAILS. The
      # release workflow's skip-and-report rule is right there because a partial release is a real
      # outcome the owner asked for; here a run that quietly did nothing is just the silence
      # problem in a new place. Somebody pressed the button to submit to the store.
      - name: Require the iOS signing secrets
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=""
          for v in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APPLE_TEAM_ID; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || missing="${missing:+$missing and }$v"
          done
          if [ -n "$missing" ]; then
            echo "::error::cannot submit for iOS: no $missing"
            echo "::error::Nothing was archived. Add the secret and dispatch again."
            exit 1
          fi
          echo "iOS signing secrets present."

      # Same stamp the Android leg writes into build.gradle: display version from the tag
      # (locked 1.0.0), build number from the run - store build codes must increase.
      - name: Compute stamp version
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(howland-(mobile-)?)?v?//')
          case "$VERSION" in
            *[!0-9.]*|"") VERSION=1.0.0 ;;  # any non-digit/dot (or nothing) is not a version
            [0-9]*.[0-9]*.[0-9]*) ;;        # a full semver from the tag — use it
            *) VERSION=1.0.0 ;;             # a bare "1" or "1.2" — the locked version
          esac
          echo "STAMP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # See release.yml: pnpm's store keyed on the lockfile. This leg is on macos-latest at
          # 10x, so the install it skips is the most expensive one in the estate.
          cache: pnpm

      - name: Stage the mobile web bundle
        uses: ./.github/actions/stage-mobile-web

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      # Same self-hosted reality on iOS, but scoped narrowly rather than via the ATS kill
      # switch -- see the step's inline comments for exactly what each key covers and why.
      - name: Allow self-hosted http servers (iOS ATS)
        working-directory: mobile
        run: |
          set -euo pipefail
          P=ios/App/App/Info.plist
          # Howland servers are self-hosted on the user's LAN, tailnet, or reachable by an
          # mDNS ".local" name, and speak plain http (no cert). Per Apple DTS
          # (developer.apple.com/forums/thread/66417): "[NSAllowsLocalNetworking] has no
          # effect on IP address loads (http://192.168.1.39/). On iOS 10 and later such loads
          # are always allowed." -- so literal LAN IPs (10.x/172.16-31.x/192.168.x) and literal
          # tailnet IPs (100.64.0.0/10) already work with NO ATS exception at all; ATS simply
          # doesn't apply to numeric IP literals. What DOES need an exception is unqualified
          # bare hostnames (http://myhowland/) and ".local" mDNS hostnames
          # (http://myhowland.local/) -- that's exactly what NSAllowsLocalNetworking covers.
          #
          # Deliberately NOT NSAllowsArbitraryLoads: that key disables ATS for every host the
          # app ever talks to, including the public internet, and is the specific blanket
          # pattern App Store review flags and requires a (frequently rejected) written
          # justification for. NSAllowsLocalNetworking covers this app's actual connection
          # patterns (LAN IP, tailnet IP, .local) without that blast radius. Do not swap this
          # back to NSAllowsArbitraryLoads to "simplify" it -- it would reopen that review risk
          # for zero functional gain.
          #
          # NOT covered by NSAllowsLocalNetworking (nor by the IP exemption above): plain-http
          # to a public FQDN (e.g. a dyndns hostname) or a Tailscale MagicDNS name
          # (foo.tailnet-name.ts.net) -- both are real dotted hostnames, not "local" by ATS's
          # definition, so ATS would still block them. Add an NSExceptionDomains entry here
          # if/when such a pattern is actually supported.
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$P" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' "$P"
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$P" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true' "$P"
          # Defensive: remove the blanket kill switch if anything (a previous run, a merge, a
          # future "helpful" edit) left it in place, so the two are never both set at once.
          /usr/libexec/PlistBuddy -c 'Delete :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$P" >/dev/null 2>&1 || true
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' "$P"

      # Local Network Privacy is a SEPARATE iOS gate from ATS (see Apple TN3179): it controls
      # whether the app can open a connection to a local-network destination at all (LAN IP or
      # .local host -- Apple's Local Network Privacy FAQ excludes VPN-type interfaces from its
      # definition of "local network", which is why this is believed to NOT gate Tailscale
      # traffic, since Tailscale presents to iOS as a VPN/tunnel interface; not verified
      # on-device). Without NSLocalNetworkUsageDescription present, iOS never shows the "Allow
      # Howland to find and connect to devices on your local network?" permission prompt and
      # the connection just fails (NSURLErrorNotConnectedToInternet -- a transport error, not
      # the TLS error ATS misconfiguration produces). This key was entirely absent before, so
      # LAN/.local connections would have failed regardless of the ATS settings above.
      - name: Declare local network usage (iOS)
        working-directory: mobile
        run: |
          set -euo pipefail
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$P" >/dev/null 2>&1 || \
            /usr/libexec/PlistBuddy -c 'Add :NSLocalNetworkUsageDescription string "Howland connects to your self-hosted Howland server on your local network."' "$P"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$P"

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: pod install

      # Import the distribution certificate into a temporary keychain and install the
      # provisioning profile. The profile NAME is derived from the decoded profile itself, so no
      # separate APPLE_PROVISIONING_PROFILE_NAME secret is required.
      - name: Setup iOS signing
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERT_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          # Without the partition-list stamp, codesign under xcodebuild hits a UI keychain
          # prompt no CI runner can answer.
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Derive the provisioning profile name from the profile file itself — and REFUSE an
          # empty result before it reaches GITHUB_ENV: under the old unhardened step a failed
          # `security cms` pipeline produced an empty name invisibly, and xcodebuild then
          # signed with an empty PROVISIONING_PROFILE_SPECIFIER instead of failing.
          PROFILE_NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
          if [ -z "$PROFILE_NAME" ]; then
            echo "::error::could not derive the provisioning profile name from the decoded profile"
            exit 1
          fi
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using provisioning profile: $PROFILE_NAME"

      - name: Build iOS archive (signed)
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.howland.app \
            MARKETING_VERSION="$STAMP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA (signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # method defaults to app-store. For direct device sideloading change it (and use a
          # matching provisioning profile) to ad-hoc or development.
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.howland.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/build"

      - name: Stage the iOS archive for App Store Connect
        run: |
          set -euo pipefail
          # Exactly one, or fail. A glob that matches nothing and reports success is how a run
          # goes green having produced no binary — the owner then downloads an empty artifact and
          # finds out at App Store Connect. Count first, never `cp <glob>` and hope.
          found=$(find "$RUNNER_TEMP/build" -maxdepth 1 -name '*.ipa')
          n=$(printf '%s' "$found" | grep -c . || true)
          if [ "$n" -ne 1 ]; then
            echo "::error::the export produced $n .ipa files, expected exactly 1:"
            echo "$found"
            exit 1
          fi
          mkdir -p out
          # Named to the asset grammar even though this never reaches the release page: the owner
          # downloads it and hands it to App Store Connect, and a file called App.ipa is not
          # identifiable once it is in a downloads folder beside anything else.
          cp "$found" out/Howland-Client-iOS-arm64.ipa
          ls -la out

      - name: Upload the submission binary
        uses: actions/upload-artifact@v7
        with:
          # The artifact carries the asset's own name, not a bundle called "ios" with unnamed
          # files inside it.
          name: Howland-Client-iOS-arm64.ipa
          path: out/Howland-Client-iOS-arm64.ipa
          # This repository is PUBLIC, and 90 days is the ceiling GitHub allows there. Explicit
          # rather than relying on the 90-day default, so a changed org default cannot silently
          # shorten it.
          retention-days: 90
          if-no-files-found: error

      # This summary is the owner's interface to this workflow: it is dispatched by hand, and the
      # binary is collected by hand from the run page. A run that says only "green" leaves the
      # person who pressed the button to go hunting for what it made.
      - name: Say what was produced and where to get it
        run: |
          set -euo pipefail
          SIZE=$(du -h out/Howland-Client-iOS-arm64.ipa | cut -f1)
          {
            echo "## Howland for iOS — submission binary"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | \`Howland-Client-iOS-arm64.ipa\` ($SIZE) |"
            echo "| Version | $STAMP_VERSION |"
            echo "| Build number | ${{ github.run_number }} |"
            echo "| Bundle id | com.howland.app |"
            echo
            echo "Download it from the **Artifacts** section of this run page, then upload it to"
            echo "App Store Connect (Transporter, or Xcode's Organizer)."
            echo
            echo "The build number rises with every dispatch, which is what App Store Connect"
            echo "requires — it refuses a re-upload at a build number it has already seen."
            echo
            echo "**This artifact expires 90 days after this run.** It is deliberately not published"
            echo "to howland-releases: that repository is public, and a signed store binary on a"
            echo "public download page is exposure with no upside, since an .ipa installs for"
            echo "nobody who grabs it. The run page is behind authentication; that is the point."
          } >> "$GITHUB_STEP_SUMMARY"
