name: Release Howland Mobile

# Tag-driven mobile release. Wraps the apps/app web build in Capacitor and produces native
# Android (APK + AAB) and iOS (IPA) apps, then publishes them to the public releases repo
# under stable, version-less names (Howland-Android.apk / Howland-Android.aab / Howland-iOS.ipa).
#
# Triggers:
#   - howland-v*        : co-publishes mobile assets onto the SAME release/tag as the desktop
#                         workflow (softprops appends assets; the last writer sets the release
#                         title). Use this for one combined all-platform release.
#   - howland-mobile-v* : an independent mobile-only release/tag. Use this to keep mobile
#                         separate from desktop.
#
# HONEST STATUS: this is a correct scaffold that has NEVER run in CI. It is not verified
# end-to-end and needs real signing keys plus a working iOS/Android build environment. The
# native android/ and ios/ projects are generated on the runner via `npx cap add` (they are
# not committed). Signing is gated on repo secrets: when a platform's signing secrets are
# absent the build still COMPILES (proving it builds) but produces no store-signed artifact,
# and never hard-fails on that account. See mobile/README.md for the required secrets.

on:
  push:
    tags:
      - 'howland-v*'
      - 'howland-mobile-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/attach (e.g. howland-mobile-v0.17.20)'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    # Expose whether this leg produced a signed artifact, so the release job can skip cleanly
    # when nothing was signed (no artifacts to download/publish).
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships the Android SDK + cmdline-tools with ANDROID_HOME / ANDROID_SDK_ROOT
      # preset, which Gradle picks up. If a future runner image drops the SDK, add
      # android-actions/setup-android here before the Gradle build.

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (apps/app)
        run: pnpm --filter @openwork/app run build:web

      # Stage the web bundle where capacitor.config.ts expects it (webDir: dist).
      - name: Stage web bundle into mobile/dist
        run: |
          rm -rf mobile/dist
          mkdir -p mobile/dist
          cp -R apps/app/dist/. mobile/dist/

      # Standalone npm project (outside the pnpm workspace): install with npm.
      # Use `npm install` (not `npm ci`) because no package-lock.json is committed; commit one
      # and switch to `npm ci` for reproducible builds.
      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Add + sync Android platform
        working-directory: mobile
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # Signing gate. Secrets context is not reliably usable directly in step `if:`, so map the
      # keystore secret to env and derive a plain boolean output the later steps gate on.
      - name: Detect Android signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets present: building a signed APK + AAB."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret: building UNSIGNED (compile-only); no store artifact."
          fi

      - name: Decode Android keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/upload.keystore

      # Signed build. Signing is injected via Gradle properties (android.injected.signing.*) so
      # we do not have to patch the cap-generated build.gradle. This signs both the APK and AAB.
      - name: Build Android (signed APK + AAB)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/upload.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      # Unsigned build: proves the project compiles when signing secrets are absent. Produces an
      # unsigned APK/AAB that we intentionally do NOT publish (skip the store artifact).
      - name: Build Android (unsigned, compile-only)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Stage signed Android artifacts (stable names)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p mobile-artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile-artifacts/Howland-Android.apk
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab mobile-artifacts/Howland-Android.aab
          ls -la mobile-artifacts

      - name: Upload Android artifacts
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: mobile-artifacts/*

  build-ios:
    runs-on: macos-latest
    # Expose whether this leg produced a signed IPA (see build-android note).
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build web bundle (apps/app)
        run: pnpm --filter @openwork/app run build:web

      - name: Stage web bundle into mobile/dist
        run: |
          rm -rf mobile/dist
          mkdir -p mobile/dist
          cp -R apps/app/dist/. mobile/dist/

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Add + sync iOS platform
        working-directory: mobile
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: mobile/ios/App
        run: pod install

      - name: Detect iOS signing
        id: signing
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
        run: |
          if [ -n "$APPLE_CERT_P12_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets present: building a signed IPA."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No APPLE_CERT_P12_BASE64 secret: building UNSIGNED (compile-only); no IPA."
          fi

      # Import the distribution certificate into a temporary keychain and install the
      # provisioning profile. The profile NAME is derived from the decoded profile itself, so no
      # separate APPLE_PROVISIONING_PROFILE_NAME secret is required.
      - name: Setup iOS signing
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Derive the provisioning profile name from the profile file itself.
          PROFILE_NAME=$(security cms -D -i "$PP_PATH" | plutil -extract Name raw -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Using provisioning profile: $PROFILE_NAME"

      - name: Build iOS archive (signed)
        if: steps.signing.outputs.enabled == 'true'
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER=com.howland.app \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA (signed)
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # method defaults to app-store. For direct device sideloading change it (and use a
          # matching provisioning profile) to ad-hoc or development.
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.howland.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/build"

      # Unsigned build: proves the iOS project compiles when signing secrets are absent. No IPA
      # is exported (export requires signing), so no store artifact is produced.
      - name: Build iOS (unsigned, compile-only)
        if: steps.signing.outputs.enabled != 'true'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Stage signed iOS artifact (stable name)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p mobile-artifacts-ios
          cp "$RUNNER_TEMP"/build/*.ipa mobile-artifacts-ios/Howland-iOS.ipa
          ls -la mobile-artifacts-ios

      - name: Upload iOS artifact
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: mobile-artifacts-ios/*

  release:
    needs: [build-android, build-ios]
    # Only run when at least one leg produced a signed artifact. `always()` lets this evaluate
    # even if a build leg failed; the outputs gate means an all-unsigned run skips this job
    # entirely (nothing to download or publish, no spurious failure).
    if: ${{ always() && (needs.build-android.outputs.signed == 'true' || needs.build-ios.outputs.signed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for RELEASE_NOTES.md)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifacts are already stable-named by the build jobs; just collect them into release/.
      # Some may be absent when a platform built unsigned; that is expected, not an error.
      - name: Collect mobile artifacts
        run: |
          mkdir -p release
          for f in Howland-Android.apk Howland-Android.aab Howland-iOS.ipa; do
            src="$(find artifacts -type f -name "$f" | head -1)"
            if [ -n "$src" ]; then cp "$src" "release/$f"; else echo "absent (unsigned/skipped): $f"; fi
          done
          echo "Mobile release assets:"; ls -la release || true

      # Clean product version from the tag (howland-mobile-v1.0.0 / howland-v1.0.0 -> 1.0.0).
      - name: Version
        id: v
        run: echo "version=$(echo "${{ github.event.inputs.tag || github.ref_name }}" | sed -E 's/^(howland-(mobile-)?)?v?//')" >> "$GITHUB_OUTPUT"

      # Publish only if at least one signed artifact was produced. RELEASES_PAT = a token with
      # contents:write on ayers-software-repair/howland-releases.
      # ONE RELEASE TRAIN: all families (desktop, mobile, server) publish onto the SAME
      # howland-v<version> release — /releases/latest/download/<name> resolves assets on the single
      # latest release only, so a separate mobile release would 404 every other family's links.
      # A howland-mobile-v1.0.0 source tag therefore maps to release tag howland-v1.0.0.
      - name: Publish to the public releases repo
        if: ${{ hashFiles('release/*') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ayers-software-repair/howland-releases
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: howland-v${{ steps.v.outputs.version }}
          name: Howland ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: No signed mobile artifacts
        if: ${{ hashFiles('release/*') == '' }}
        run: echo "No signed mobile artifacts were produced (signing secrets absent). Nothing published; not a failure."
