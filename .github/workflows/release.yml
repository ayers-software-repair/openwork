name: Release Howland Desktop

# Tag-driven release: pushing a howland-v* tag builds every desktop OS and
# publishes one GitHub Release carrying the Howland-branded installers. Same build
# steps as build-electron-desktop.yml; branding is build-time only so electron-builder.yml
# stays untouched and upstream still merges. Signing is intentionally absent (unsigned now);
# when signing secrets exist they slot into the package step without changing this shape.

on:
  push:
    tags:
      - 'howland-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/attach (e.g. howland-v1.0.0)'
        required: true

# The GITHUB_TOKEN only checks out this repo; publishing goes through RELEASES_PAT.
permissions:
  contents: read

jobs:
  build:
    # Repo guard: this fork rebases onto upstream, and an unguarded release workflow on the
    # wrong clone is a live publish path. The guard also keeps a future upstream-merged copy
    # inert anywhere but here.
    if: github.repository == 'ayers-software-repair/openwork'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          # Intel Macs get a native x64 build: users' machines are unknown, so both Mac
          # architectures ship. macos-15-intel is GitHub's x64 image (supported into 2027);
          # process.arch=x64 there makes prepare-sidecar fetch the x86_64 opencode automatically.
          - os: macos-15-intel
            artifact: macos-intel
          - os: ubuntu-latest
            artifact: linux
          # Linux arm64 (Raspberry Pi, arm64 servers/desktops). Native runner rather than a
          # cross-build: electron-builder needs real per-architecture native modules, and
          # prepare-sidecar.mjs resolves the sidecar from process.arch on the host. The sibling
          # release-macos-aarch64.yml already builds this way on an arm runner.
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}
    # A hung leg would otherwise burn the 360-minute default; notarization can add 5-20 min.
    timeout-minutes: 60

    # Soft-fail signing gates. The secrets context is NOT allowed in an `if:` (it fails the
    # whole run at parse time), so derive plain booleans here and gate steps on env — the
    # same pattern as the howland repo's server-release.yml. Secrets absent => every signing
    # step skips => byte-for-byte today's unsigned build.
    env:
      MAC_SIGN: ${{ secrets.APPLE_DESKTOP_CERT_P12_BASE64 != '' }}
      MAC_NOTARIZE: ${{ secrets.APPLE_DESKTOP_CERT_P12_BASE64 != '' && secrets.APPLE_NOTARY_KEY_P8 != '' }}
      WIN_SIGN: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- macOS signing (soft-fail) --------------------------------------------------------
      # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD straight from the environment, and
      # an EMPTY CSC_LINK is NOT treated as unset: app-builder-lib keeps "" (getCscLink uses
      # chooseNotNull) and only skips signing on null, so an empty string reaches
      # createKeychain -> `security import` of a zero-byte p12 -> hard failure. So these vars
      # are exported HERE, inside a gated step, never at job level from possibly-empty
      # secrets. Heredoc form guards against line-wrapped base64 values.
      - name: Enable macOS code signing (when cert secret present)
        if: ${{ runner.os == 'macOS' && env.MAC_SIGN == 'true' }}
        env:
          P12_B64: ${{ secrets.APPLE_DESKTOP_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_DESKTOP_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "CSC_LINK<<__HOWLAND_EOF__";         echo "$P12_B64";  echo "__HOWLAND_EOF__"
            echo "CSC_KEY_PASSWORD<<__HOWLAND_EOF__"; echo "$P12_PASS"; echo "__HOWLAND_EOF__"
          } >> "$GITHUB_ENV"
          echo "macOS signing enabled (Developer ID Application cert via CSC_LINK)."

      # app-builder's bundled fpm is an x86 binary on every non-amd64 platform (its
      # tool.go picks "-x86_64" for amd64 and "-x86" for everything else, and
      # electron-builder-binaries publishes no linux-arm64 fpm at all), so the arm64 leg's
      # .deb target cannot use it. USE_SYSTEM_FPM is app-builder's documented escape hatch;
      # a system Ruby fpm builds the same package. Pinned so the .deb metadata is stable.
      - name: System fpm for the arm64 .deb (app-builder ships no arm64 fpm)
        if: ${{ matrix.os == 'ubuntu-24.04-arm' }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ruby ruby-dev build-essential
          sudo gem install fpm -v 1.15.1 --no-document
          fpm --version
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"

      # The after-sign hook (apps/desktop/scripts/electron-after-sign.cjs) notarizes only when
      # MACOS_NOTARIZE=true and needs APPLE_API_KEY_PATH (.p8 on disk), APPLE_API_KEY (key id)
      # and APPLE_API_ISSUER — the exact env set upstream's release-macos-aarch64.yml feeds
      # the same hook. Secret names reuse the howland repo's server-release.yml notary scheme
      # so ONE App Store Connect key is stored under the SAME names in both repos.
      - name: Enable macOS notarization (when notary key present)
        if: ${{ runner.os == 'macOS' && env.MAC_NOTARIZE == 'true' }}
        env:
          NOTARY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/howland-notary.p8"
          printf '%s' "$NOTARY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          {
            echo "MACOS_NOTARIZE=true"
            echo "APPLE_API_KEY_PATH=$KEY"
            echo "APPLE_API_KEY=$NOTARY_KEY_ID"
            echo "APPLE_API_ISSUER=$NOTARY_ISSUER"
          } >> "$GITHUB_ENV"
          echo "macOS notarization enabled (notarytool API key)."

      # Main package step. On Ubuntu this builds AppImage + tar.gz + deb (deb comes from the
      # electron-builder.yml linux.target list — see the comment there for why deb can't be
      # added purely via a `-c` override). Branding stays build-time-only via `-c`.
      - name: Package Electron desktop (Howland installers)
        shell: bash
        env:
          # Kill upstream analytics: an empty key disables PostHog in any build (the resolver
          # otherwise falls back to upstream's hardcoded default key in prod builds).
          VITE_OPENWORK_POSTHOG_KEY: ""
          # The sidecar comes from the Howland-branded opencode fork, not upstream: the fork's
          # release v1.17.11-howland (upstream v1.17.11 + Howland TUI theme) carries the same
          # six asset names prepare-sidecar.mjs resolves. That release MUST exist before this
          # workflow runs — the sidecar fetch exits 1 on a missing asset and one dead leg
          # blocks the whole desktop release (see the fork's howland-sidecar.yml).
          OPENCODE_GITHUB_REPO: ayers-software-repair/opencode
        run: |
          # Stamp the app version from the release tag, NOT apps/desktop/package.json (still upstream's
          # 0.17.20). Without this the packaged app reports the fork's upstream version in About and to
          # the updater, so a machine on the 1.0.0 release would see itself as 0.17.20 and be offered a
          # bogus "update" to what it already runs. extraMetadata overrides the version at pack time so
          # electron-builder.yml / package.json stay untouched and upstream still merges. Version-locked
          # to 1.0.0 until production is declared (mirrors Neptune's <Version>1.0.0</Version>); once a
          # real tag drives it (howland-v1.2.3), that flows through here automatically.
          VERSION=$(echo "${{ github.event.inputs.tag || github.ref_name }}" | sed -E 's/^(howland-)?v?//')
          case "$VERSION" in
            *[!0-9.]*) VERSION=1.0.0 ;;   # any non-digit/dot means not a version
            [0-9]*.[0-9]*.[0-9]*) ;;   # a semver from the tag — use it
            *) VERSION=1.0.0 ;;         # branch build / malformed tag — fall back to the locked version
          esac
          echo "Stamping Howland app version: $VERSION"
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml \
            -c.productName=Howland -c.appId=com.howland.app \
            -c.extraMetadata.version="$VERSION" \
            '-c.artifactName=howland-${os}-${arch}-${version}.${ext}' \
            -c.extraMetadata.description="Howland - private, offline, self-hosted AI and survival library" \
            -c.copyright="Copyright Ayers Electronics Inc. All rights reserved." \
            '-c.deb.maintainer=Ayers Electronics' \
            -c.linux.description="Howland - private, offline, self-hosted AI and survival library" \
            --publish never

      # --- Windows Authenticode (soft-fail, isolated + swappable) ---------------------------
      # Signs the final NSIS installer with signtool — same mechanism, secret names and
      # env-boolean gate as the howland repo's server-release.yml "Sign the .exe" step. Runs
      # on both windows legs; skips cleanly when WINDOWS_CERT_PFX_BASE64 is absent.
      #
      # >>> SWAP POINT (Azure Trusted Signing) <<<
      # File-based PFX certs are no longer purchasable (see the private build-farm repo,
      # signing/READINESS.md); when
      # Azure Trusted Signing is provisioned, replace ONLY this step with
      # azure/trusted-signing-action (files-folder: apps/desktop/dist-electron, filter *.exe)
      # and redefine WIN_SIGN at the job level to test the Azure secrets instead
      # (e.g. secrets.AZURE_TENANT_ID != ''). Nothing else moves: SHA256SUMS-desktop.txt is
      # computed in the release job AFTER this, so checksums always cover the signed bytes.
      - name: Sign the Windows installer (Authenticode)
        if: ${{ runner.os == 'Windows' && env.WIN_SIGN == 'true' }}
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "howland-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $archDir = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { 'x64' }
          $signtool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match $archDir } | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe for $archDir not found under Windows Kits - the runner image changed" }
          foreach ($exe in (Get-ChildItem "apps/desktop/dist-electron" -Filter *.exe)) {
            & $signtool sign /f $pfx /p $env:PFX_PWD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 /d "Howland" $exe.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($exe.Name)" }
          }
          Remove-Item $pfx

      # OWNER RULING 2026-08-24: auto-update ships in 1.0. electron-builder emits updater
      # metadata even under --publish never; its file entries reference the VERSIONED
      # artifact names, while the release serves STABLE names — same bytes, renamed, so the
      # recorded sha512/size stay valid and only the names need rewriting. Each leg then
      # renames its metadata to the per-platform+arch channel file the app requests
      # (howlandUpdaterChannel in electron/updater.mjs — the two lists must match).
      - name: Stable-name the updater metadata
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          case "${{ matrix.artifact }}" in
            macos)         SRC=latest-mac.yml;  OUT=latest-mac.yml ;;
            macos-intel)   SRC=latest-mac.yml;  OUT=latest-mac-x64.yml ;;
            windows)       SRC=latest.yml;      OUT=latest.yml ;;
            windows-arm64) SRC=latest.yml;      OUT=latest-arm64.yml ;;
            linux)         SRC=latest-linux.yml;       OUT=latest-linux.yml ;;
            linux-arm64)   SRC=$(find . -maxdepth 1 -name 'latest-linux*.yml' -printf '%f\n' | head -1); OUT=latest-linux-arm64.yml ;;
          esac
          test -f "$SRC" || { echo "::error::updater metadata $SRC was not emitted"; exit 1; }
          python3 - "$SRC" <<'PY'
          import re, sys
          src = sys.argv[1]
          stable = {
            "macos":         {"zip": "Howland-macOS.zip",        "dmg": "Howland-macOS.dmg"},
            "macos-intel":   {"zip": "Howland-macOS-Intel.zip",  "dmg": "Howland-macOS-Intel.dmg"},
            "windows":       {"exe": "Howland-Windows.exe"},
            "windows-arm64": {"exe": "Howland-Windows-arm64.exe"},
            "linux":         {"AppImage": "Howland-Linux.AppImage"},
            "linux-arm64":   {"AppImage": "Howland-Linux-arm64.AppImage"},
          }["${{ matrix.artifact }}"]
          text = open(src).read()
          def sub(m):
              ext = m.group(1)
              return stable.get(ext, m.group(0))
          text = re.sub(r"howland-[A-Za-z0-9._-]+\.(zip|dmg|exe|AppImage)", sub, text)
          open(src, "w").write(text)
          print(text)
          PY
          if [ "$SRC" != "$OUT" ]; then mv "$SRC" "$OUT"; fi
          rm -f latest*.yml.bak

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: howland-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.tar.gz
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.exe
            apps/desktop/dist-electron/latest*.yml

  release:
    needs: build
    if: github.repository == 'ayers-software-repair/openwork'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ONE RELEASE TRAIN guard: this workflow and mobile-release.yml both fire on howland-v*
    # tags and publish onto the SAME howland-releases release. A shared job-level group
    # serializes just the publish jobs (not the builds) so softprops never races itself
    # creating/updating the release. Constant name on purpose: publishes are quick, the
    # version is locked at 1.0.0, and job-level concurrency can't see step-computed tags.
    concurrency:
      group: howland-releases-publish
      cancel-in-progress: false
    steps:
      - name: Checkout (for RELEASE_NOTES.md)
        uses: actions/checkout@v7

      - name: Download all installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Rename to STABLE, version-less names so the site's latest/download/<name> URLs never change
      # between versions (the MeridianVega trap: versioned asset names break the "latest" links).
      - name: Collect + rename installers to stable names
        run: |
          mkdir -p release
          # Exactly one match, or fail. `head -1` would silently publish an arbitrary file when a
          # glob matches several — which is precisely how a wrong-architecture package ships under
          # the right name, and nothing downstream would catch it.
          pick() {
            local found; found=$(find artifacts -type f -name "$1")
            local n; n=$(printf '%s' "$found" | grep -c . || true)
            if [ "$n" -ne 1 ]; then
              echo "::error::glob '$1' matched $n files, expected exactly 1:"; echo "$found"; exit 1
            fi
            printf '%s' "$found"
          }
          # Two mac architectures build now, so the globs are arch-specific (artifactName
          # renders howland-mac-arm64-* and howland-mac-x64-*).
          cp "$(pick '*mac-arm64*.dmg')"         release/Howland-macOS.dmg
          cp "$(pick '*mac-arm64*.zip')"         release/Howland-macOS.zip
          cp "$(pick '*mac-x64*.dmg')"           release/Howland-macOS-Intel.dmg
          cp "$(pick '*mac-x64*.zip')"           release/Howland-macOS-Intel.zip
          cp "$(pick '*win-x64*.exe')"           release/Howland-Windows.exe
          cp "$(pick '*win-arm64*.exe')"         release/Howland-Windows-arm64.exe
          cp "$(pick '*linux-x86_64*.AppImage')" release/Howland-Linux.AppImage
          cp "$(pick '*linux-x64*.tar.gz')"      release/Howland-Linux.tar.gz
          # ${arch} in artifactName is not one token across Linux targets. From electron-builder's
          # own getArtifactArchName(arch, ext) in builder-util:
          #   AppImage  x64 -> x86_64   arm64 -> arm64
          #   tar.gz    x64 -> x64      arm64 -> arm64
          #   deb       x64 -> amd64    arm64 -> arm64
          # The .deb glob used to be a bare '*.deb' on the grounds that only one Linux leg existed.
          # Two do now, so it is arch-specific — a bare glob would have picked whichever the
          # filesystem returned first and could have published an arm64 package under the x64 name.
          cp "$(pick '*linux-amd64*.deb')"       release/Howland-Linux.deb
          cp "$(pick '*linux-arm64*.AppImage')"  release/Howland-Linux-arm64.AppImage
          cp "$(pick '*linux-arm64*.tar.gz')"    release/Howland-Linux-arm64.tar.gz
          cp "$(pick '*linux-arm64*.deb')"       release/Howland-Linux-arm64.deb
          # The six per-platform+arch updater metadata files ride the same release; each leg
          # produced exactly one, uniquely named.
          find artifacts -name 'latest*.yml' -exec cp {} release/ \;
          YMLS=$(find release -maxdepth 1 -name 'latest*.yml' | wc -l)
          if [ "$YMLS" -ne 6 ]; then echo "::error::expected 6 updater metadata files, found $YMLS"; exit 1; fi
          # Integrity: checksums published next to the binaries (sha256sum -c SHA256SUMS-desktop.txt).
          ( cd release && sha256sum Howland-* > SHA256SUMS-desktop.txt )
          echo "Stable-named installers:"; ls -la release

      # Clean product version from the tag (howland-v1.0.0 -> 1.0.0), normalized EXACTLY like
      # the build job's stamp: a non-semver value (branch dispatch, malformed tag) falls back
      # to the locked 1.0.0, so tag_name below can never mint a stray public tag and the
      # published tag always matches the version stamped into the binaries.
      - name: Version
        id: v
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(echo "$RAW_TAG" | sed -E 's/^(howland-)?v?//')
          case "$VERSION" in
            *[!0-9.]*) VERSION=1.0.0 ;;   # any non-digit/dot means not a version
            [0-9]*.[0-9]*.[0-9]*) ;;   # a semver from the tag — use it
            *) VERSION=1.0.0 ;;         # branch build / malformed tag — the locked version
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publish to the PUBLIC howland-releases repo (the public download + issues home). PUBLIC so the site
      # links to /releases/latest/download/<StableName>, always current, zero redeploy. RELEASES_PAT = a
      # token with contents:write on ayers-software-repair/howland-releases, set as a secret on this fork.
      # Notes come from RELEASE_NOTES.md in this repo; edit that file per version to tune the release notes.
      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v3
        with:
          repository: ayers-software-repair/howland-releases
          token: ${{ secrets.RELEASES_PAT }}
          # Normalized, never the raw ref: a v* or malformed tag/dispatch input must not mint
          # a second release tag on howland-releases — that would become "latest" and 404
          # every family's /releases/latest/download/<name> link (ONE RELEASE TRAIN).
          tag_name: howland-v${{ steps.v.outputs.version }}
          # All families (desktop, mobile, server) share ONE release per version; the title is the
          # plain product+version so whichever workflow publishes last leaves the same name.
          name: Howland ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
