name: Release Howland Desktop

# Tag-driven release: pushing a howland-v* (or v*) tag builds every desktop OS and
# publishes one GitHub Release carrying the Howland-branded installers. Same build
# steps as build-electron-desktop.yml; branding is build-time only so electron-builder.yml
# stays untouched and upstream still merges. Signing is intentionally absent (unsigned now);
# when signing secrets exist they slot into the package step without changing this shape.

on:
  push:
    tags:
      - 'howland-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/attach (e.g. howland-v0.17.20)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          # Intel Macs get a native x64 build: users' machines are unknown, so both Mac
          # architectures ship. macos-15-intel is GitHub's x64 image (supported into 2027);
          # process.arch=x64 there makes prepare-sidecar fetch the x86_64 opencode automatically.
          - os: macos-15-intel
            artifact: macos-intel
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: windows-11-arm
            artifact: windows-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Main package step. On Ubuntu this builds AppImage + tar.gz + deb (deb comes from the
      # electron-builder.yml linux.target list — see the comment there for why deb can't be
      # added purely via a `-c` override). Branding stays build-time-only via `-c`.
      - name: Package Electron desktop (Howland installers)
        shell: bash
        env:
          # Kill upstream analytics: an empty key disables PostHog in any build (the resolver
          # otherwise falls back to upstream's hardcoded default key in prod builds).
          VITE_OPENWORK_POSTHOG_KEY: ""
        run: |
          pnpm --filter @openwork/desktop run build:electron
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml \
            -c.productName=Howland -c.appId=com.howland.app \
            '-c.artifactName=howland-${os}-${arch}-${version}.${ext}' \
            -c.mac.icon=resources/icons/howland-icon.png \
            -c.win.icon=resources/icons/howland-icon.png \
            -c.linux.icon=resources/icons/howland-icon.png \
            -c.description="Howland - private, self-hosted offline AI and complete offline survival library" \
            -c.linux.description="Howland - private, self-hosted offline AI and complete offline survival library" \
            -c.publish.0.owner=ayers-software-repair -c.publish.0.repo=howland-releases \
            --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: howland-${{ matrix.artifact }}
          path: |
            apps/desktop/dist-electron/*.dmg
            apps/desktop/dist-electron/*.zip
            apps/desktop/dist-electron/*.AppImage
            apps/desktop/dist-electron/*.tar.gz
            apps/desktop/dist-electron/*.deb
            apps/desktop/dist-electron/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for RELEASE_NOTES.md)
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Rename to STABLE, version-less names so the site's latest/download/<name> URLs never change
      # between versions (the MeridianVega trap: versioned asset names break the "latest" links).
      - name: Collect + rename installers to stable names
        run: |
          mkdir -p release
          pick() { find artifacts -type f -name "$1" | head -1; }
          # Two mac architectures build now, so the globs are arch-specific (artifactName
          # renders howland-mac-arm64-* and howland-mac-x64-*).
          cp "$(pick '*mac-arm64*.dmg')"         release/Howland-macOS.dmg
          cp "$(pick '*mac-arm64*.zip')"         release/Howland-macOS.zip
          cp "$(pick '*mac-x64*.dmg')"           release/Howland-macOS-Intel.dmg
          cp "$(pick '*mac-x64*.zip')"           release/Howland-macOS-Intel.zip
          cp "$(pick '*win-x64*.exe')"           release/Howland-Windows.exe
          cp "$(pick '*win-arm64*.exe')"         release/Howland-Windows-arm64.exe
          cp "$(pick '*linux-x86_64*.AppImage')" release/Howland-Linux.AppImage
          cp "$(pick '*linux-x64*.tar.gz')"      release/Howland-Linux.tar.gz
          # deb: match the bare extension, not an arch token. ${arch} in artifactName is not
          # stable across Linux targets (AppImage renders x86_64, tar.gz renders x64); exactly
          # one .deb is produced by the single x64 Ubuntu leg, so the bare glob is unambiguous.
          cp "$(pick '*.deb')"                   release/Howland-Linux.deb
          # Integrity: checksums published next to the binaries (sha256sum -c SHA256SUMS-desktop.txt).
          ( cd release && sha256sum Howland-* > SHA256SUMS-desktop.txt )
          echo "Stable-named installers:"; ls -la release

      # Clean product version from the tag (howland-v1.0.0 -> 1.0.0).
      - name: Version
        id: v
        run: echo "version=$(echo "${{ github.event.inputs.tag || github.ref_name }}" | sed -E 's/^(howland-)?v?//')" >> "$GITHUB_OUTPUT"

      # Publish to the PUBLIC howland-releases repo (the public download + issues home). PUBLIC so the site
      # links to /releases/latest/download/<StableName>, always current, zero redeploy. RELEASES_PAT = a
      # token with contents:write on ayers-software-repair/howland-releases, set as a secret on this fork.
      # Notes come from RELEASE_NOTES.md in this repo; edit that file per version to tune the release notes.
      - name: Publish to the public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: ayers-software-repair/howland-releases
          token: ${{ secrets.RELEASES_PAT }}
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # All families (desktop, mobile, server) share ONE release per version; the title is the
          # plain product+version so whichever workflow publishes last leaves the same name.
          name: Howland ${{ steps.v.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
