# IMPORTANT: appId intentionally matches the Tauri shell so both builds share
# the same macOS bundle identifier, keychain entries, Launchpad slot, and TCC
# permissions. In-place migration from Tauri to Electron depends on this.
appId: com.differentai.openwork
productName: OpenWork
protocols:
  - name: OpenWork
    schemes:
      - openwork
directories:
  output: dist-electron
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
extraResources:
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
  - from: ../../packages/docs
    to: openwork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
# electron-updater feed. Matches the existing release workflow's GitHub target
# so both Tauri (latest.json) and Electron (latest*.yml) can live on the same
# release assets during the migration window.
publish:
  - provider: github
    owner: ayers-software-repair
    repo: howland-releases
    releaseType: release
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OpenWork uses the microphone when you start Voice Mode so you can speak commands to your agent.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - openwork-orchestrator
        - openwork-orchestrator-aarch64-apple-darwin
        - openwork-orchestrator-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "OpenWork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/icon.png
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - openwork-orchestrator
        - openwork-orchestrator-aarch64-unknown-linux-gnu
        - openwork-orchestrator-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  # Howland: `deb` is added here as the fallback for multi-target Linux builds. The CI
  # workflows brand via `-c` overrides to keep this file upstream-clean, but electron-builder
  # v25's dotted-index CLI form `-c.linux.target.0=AppImage -c.linux.target.1=tar.gz ...` does
  # NOT work: yargs-parser (with electron-builder's `camel-case-expansion:false` config) turns
  # numeric dot-keys into an object {0:...,1:...}, not an array, and electron-builder does not
  # coerce it back to a target list. So multi-target Linux can't be expressed purely via `-c`;
  # this one-line list edit is the tradeoff (a small diff on an otherwise-upstream-clean file).
  # `snap` is intentionally NOT built: electron-builder's snap target fails in CI with
  # ERR_ELECTRON_BUILDER_CANNOT_EXECUTE ("expected argument for flag '--executable'"), a known
  # upstream defect. Rather than ship a silently-skipped step, Linux ships AppImage + tar.gz + deb.
  target:
    - AppImage
    # tar.gz removed (owner ruling: a user is never handed a zip, and a tar.gz is a zip by
    # another name). Building it only to discard it in the release job wasted a transfer.
    - deb
win:
  icon: resources/icons/icon.ico
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - openwork-orchestrator.exe
        - openwork-orchestrator-aarch64-pc-windows-msvc.exe
        - openwork-orchestrator-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc.exe
        - versions.json-x86_64-pc-windows-msvc.exe
  target:
    # appx is the Windows Store target. electron-builder 25.1.8 has exactly one
    # (app-builder-lib/out/targets/AppxTarget.js:46 `super("appx")`); there is no msix target and
    # the Store accepts .appx. It builds without a PARTNER CENTER identity — that is needed to
    # SUBMIT, not to produce the package — so the artifact exists before a Partner Center
    # identity does, which is the deliverable.
    - nsis
    - appx
appx:
  # electron-builder validates the identity's SHAPE at build time even though the real values
  # only matter at submission: its default identityName derives from package.json `name`
  # ("@openwork/desktop"), whose @ and / fail the alpha-numeric/period/dash rule — measured on
  # this leg's first real build (run 33455182968, both Windows arches, same error). A VALID
  # placeholder lets the package build; Partner Center assigns the real identity at submission
  # and these values are replaced then.
  identityName: Howland.Desktop
nsis:
  include: build/installer.nsh
artifactName: openwork-${os}-${arch}-${version}.${ext}
